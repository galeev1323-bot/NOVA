
name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Unpack project
        run: unzip -q "$(ls *.zip | head -1)"

      - name: Configure keys
        working-directory: NOVA
        run: |
          echo "supabase.url=${{ secrets.SUPABASE_URL }}" > local.properties
          echo "supabase.anon.key=${{ secrets.SUPABASE_ANON_KEY }}" >> local.properties

      - name: Build
        working-directory: NOVA
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: nova-apk
          path: NOVA/app/build/outputs/apk/debug/app-debug.apk
