name: Build NOVA 2.3.0

concurrency:
  group: nova-2.3.0-build
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - nova-2.3.0
    paths:
      - 'NOVA/**'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Configure Supabase
        working-directory: NOVA
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            printf 'supabase.url=%s\nsupabase.anon.key=%s\n' "$SUPABASE_URL" "$SUPABASE_ANON_KEY" > local.properties
          else
            printf 'supabase.url=https://YOUR_PROJECT.supabase.co\nsupabase.anon.key=YOUR_ANON_KEY\n' > local.properties
            echo "Supabase secrets are not configured; APK will show backend setup screen."
          fi
      - name: Build debug APK
        working-directory: NOVA
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: nova-2.3.0-debug-apk
          path: NOVA/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Detect release signing configuration
        id: release-signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nova-release.jks"
            test -s "$RUNNER_TEMP/nova-release.jks" || (echo "Invalid keystore data" && exit 1)
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Release signing secrets are not configured; skipping signed release build."
          fi
      - name: Build signed release APK and AAB
        if: steps.release-signing.outputs.available == 'true'
        working-directory: NOVA
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/nova-release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        if: steps.release-signing.outputs.available == 'true'
        with:
          name: nova-2.3.0-release
          path: |
            NOVA/app/build/outputs/apk/release/*.apk
            NOVA/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
