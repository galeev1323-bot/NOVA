name: Build NOVA 2.1.0 APK

on:
  workflow_dispatch:
  push:
    branches:
      - nova-2.1.0
    paths:
      - 'NOVA/**'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Configure Supabase
        working-directory: NOVA
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          test -n "$SUPABASE_URL" || (echo "Missing SUPABASE_URL secret" && exit 1)
          test -n "$SUPABASE_ANON_KEY" || (echo "Missing SUPABASE_ANON_KEY secret" && exit 1)
          printf 'supabase.url=%s\nsupabase.anon.key=%s\n' "$SUPABASE_URL" "$SUPABASE_ANON_KEY" > local.properties

      - name: Build debug APK
        working-directory: NOVA
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: nova-2.1.0-debug-apk
          path: NOVA/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
