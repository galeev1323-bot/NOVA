
name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Unpack project
        run: unzip -q "$(ls *.zip | head -1)"

      - name: Configure keys
        working-directory: NOVA
        run: |
          echo "supabase.url=${{ secrets.SUPABASE_URL }}" > local.properties
          echo "supabase.anon.key=${{ secrets.SUPABASE_ANON_KEY }}" >> local.properties

      - name: Show ChatScreen code around the error
        working-directory: NOVA
        run: |
          echo '--- ChatScreen.kt lines 185-215 ---'
          nl -ba app/src/main/java/com/nova/messenger/ui/ChatScreen.kt | sed -n '185,215p'

      - name: Fix premium declaration order
        working-directory: NOVA
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/nova/messenger/ui/ChatScreen.kt')
          s = p.read_text()
          declaration = '    val premium = me?.hasPremiumAccess == true\\n'
          if s.count(declaration) != 1:
              raise SystemExit('Expected exactly one premium declaration; refusing unsafe patch')
          s = s.replace(declaration, '')
          target = '    var wallpaper by remember(chatId, me?.chatTheme, premium)'
          if s.count(target) != 1:
              raise SystemExit('Could not find wallpaper declaration; refusing unsafe patch')
          s = s.replace(target, declaration + target)
          p.write_text(s)
          print('Moved premium declaration above its first use.')
          PY

      - name: Build
        working-directory: NOVA
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: nova-apk
          path: NOVA/app/build/outputs/apk/debug/app-debug.apk
